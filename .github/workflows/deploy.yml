name: Deploy TonnerreIA

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22

      - name: Installer Wrangler
        run: npm install -g wrangler

      - name: Vérifier Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          test -n "$CLOUDFLARE_API_TOKEN" || (
            echo "❌ CLOUDFLARE_API_TOKEN absent"
            exit 1
          )

          test -n "$CLOUDFLARE_ACCOUNT_ID" || (
            echo "❌ CLOUDFLARE_ACCOUNT_ID absent"
            exit 1
          )

          echo "✅ Secrets Cloudflare détectés."

      - name: Déployer TonnerreIA

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          wrangler deploy
