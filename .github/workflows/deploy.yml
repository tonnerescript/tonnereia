name: Deploy TonnerreIA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Vérifier le code
        run: |
          echo "=== COMMIT ==="
          git log -1 --oneline

          echo "=== WORKER ==="
          sed -n '1,140p' worker/worker.js

          echo "=== RECHERCHE OPENAI ==="
          if grep -RniE "api\.openai\.com|OPENAI_API_KEY|openai" worker/worker.js; then
            echo "❌ Référence OpenAI trouvée"
            exit 1
          else
            echo "✅ Aucun appel OpenAI trouvé"
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Wrangler
        run: npm install -g wrangler@latest

      - name: Vérifier Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
          echo "✅ Secrets Cloudflare détectés"

      - name: Déployer TonnerreIA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.jsonc
