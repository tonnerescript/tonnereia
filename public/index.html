<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OneScript AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07070b;
      color: #fff;
      min-height: 100vh;
    }

    header {
      height: 70px;
      border-bottom: 1px solid #202027;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      background: #0b0b10;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #8b5cf6;
    }

    .status {
      font-size: 13px;
      color: #8aff9b;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #45ff65;
      border-radius: 50%;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 55px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: #8b5cf6;
    }

    .hero p {
      color: #9999a8;
      max-width: 650px;
      margin: auto;
      line-height: 1.6;
    }

    .generator {
      background: #101017;
      border: 1px solid #24242f;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: #08080d;
      color: white;
      border: 1px solid #292936;
      border-radius: 14px;
      padding: 18px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }

    .type {
      background: #171720;
      border: 1px solid #2c2c38;
      color: #bbb;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .type.active {
      background: #8b5cf6;
      color: white;
      border-color: #8b5cf6;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #generate {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
    }

    #generate:hover {
      background: #7c3aed;
    }

    #generate:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 25px;
      color: #aaa;
    }

    .loading.show {
      display: block;
    }

    .result {
      display: none;
      margin-top: 25px;
    }

    .result.show {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .project-name {
      font-size: 23px;
      font-weight: bold;
    }

    .download {
      background: #22c55e;
      color: #07100a;
      padding: 12px 17px;
      border-radius: 10px;
    }

    .files {
      display: grid;
      gap: 8px;
    }

    .file {
      background: #0b0b11;
      border: 1px solid #24242f;
      border-radius: 10px;
      padding: 13px 15px;
      font-family: monospace;
      color: #c8b5ff;
    }

    .preview {
      margin-top: 20px;
    }

    .preview iframe {
      width: 100%;
      height: 500px;
      border: 1px solid #292936;
      border-radius: 14px;
      background: white;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #301217;
      border: 1px solid #68202b;
      color: #ff9da9;
      border-radius: 10px;
    }

    .error.show {
      display: block;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 15px;
      }

      main {
        padding: 35px 12px;
      }

      .generator {
        padding: 14px;
      }

      .preview iframe {
        height: 400px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    One<span>Script</span> AI
  </div>

  <div class="status">
    <span class="dot"></span>
    AI en ligne
  </div>
</header>

<main>

  <section class="hero">
    <h1>
      Crée n'importe quel<br>
      <span>projet avec l'IA.</span>
    </h1>

    <p>
      Décris simplement ce que tu veux créer.
      OneScript AI génère automatiquement la structure,
      les fichiers et le code de ton projet.
    </p>
  </section>

  <section class="generator">

    <textarea
      id="prompt"
      placeholder="Exemple : Crée un bot Discord complet avec tickets, modération, logs et commandes slash..."
    ></textarea>

    <div class="options">

      <button class="type active" data-type="auto">
        ✨ Auto
      </button>

      <button class="type" data-type="website">
        🌐 Site Web
      </button>

      <button class="type" data-type="discord-bot">
        🤖 Bot Discord
      </button>

      <button class="type" data-type="python">
        🐍 Python
      </button>

      <button class="type" data-type="javascript">
        🟨 JavaScript
      </button>

      <button class="type" data-type="typescript">
        🔷 TypeScript
      </button>

      <button class="type" data-type="react">
        ⚛️ React
      </button>

      <button class="type" data-type="godot">
        🎮 Godot
      </button>

    </div>

    <button id="generate">
      ⚡ Générer le projet
    </button>

    <div class="loading" id="loading">
      🧠 OneScript AI génère ton projet...
    </div>

    <div class="error" id="error"></div>

    <section class="result" id="result">

      <div class="result-header">

        <div>
          <div class="project-name" id="projectName">
            Projet
          </div>

          <div style="color:#888;margin-top:5px" id="projectType">
            Type : auto
          </div>
        </div>

        <button class="download" id="download">
          📦 Télécharger le ZIP
        </button>

      </div>

      <div class="files" id="files"></div>

      <div class="preview" id="previewContainer">
      </div>

    </section>

  </section>

</main>

<script>

const API = "";

let selectedType = "auto";
let currentProject = null;

const promptInput =
  document.getElementById("prompt");

const generateButton =
  document.getElementById("generate");

const loading =
  document.getElementById("loading");

const result =
  document.getElementById("result");

const errorBox =
  document.getElementById("error");

const projectName =
  document.getElementById("projectName");

const projectType =
  document.getElementById("projectType");

const filesContainer =
  document.getElementById("files");

const previewContainer =
  document.getElementById("previewContainer");

const downloadButton =
  document.getElementById("download");


/*
 * Sélection du type de projet
 */

document.querySelectorAll(".type").forEach(button => {

  button.addEventListener("click", () => {

    document
      .querySelectorAll(".type")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedType =
      button.dataset.type;

  });

});


/*
 * Afficher une erreur
 */

function showError(message) {

  errorBox.textContent =
    message || "Une erreur est survenue.";

  errorBox.classList.add("show");

}


/*
 * Génération du projet
 */

generateButton.addEventListener("click", async () => {

  const prompt =
    promptInput.value.trim();

  if (!prompt) {

    showError(
      "Décris d'abord le projet que tu veux créer."
    );

    return;
  }

  errorBox.classList.remove("show");

  result.classList.remove("show");

  previewContainer.innerHTML = "";

  filesContainer.innerHTML = "";

  loading.classList.add("show");

  generateButton.disabled = true;

  try {

    const response =
      await fetch(
        API + "/api/project",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prompt,
            type: selectedType
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "La génération a échoué."
      );

    }

    currentProject =
      data.project;

    displayProject(
      currentProject
    );

  } catch (error) {

    showError(
      error.message
    );

  } finally {

    loading.classList.remove("show");

    generateButton.disabled = false;

  }

});


/*
 * Affichage du projet
 */

function displayProject(project) {

  projectName.textContent =
    project.projectName ||
    "Projet OneScript";

  projectType.textContent =
    "Type : " +
    (project.type || "auto");

  filesContainer.innerHTML = "";

  const files =
    project.files || {};

  Object.keys(files)
    .sort()
    .forEach(filename => {

      const div =
        document.createElement("div");

      div.className =
        "file";

      div.textContent =
        "📄 " + filename;

      filesContainer.appendChild(div);

    });

  /*
   * Aperçu automatique pour un site HTML
   */

  const htmlFile =
    Object.keys(files).find(
      name =>
        name.toLowerCase() ===
        "index.html"
    );

  if (
    htmlFile &&
    files[htmlFile]
  ) {

    const iframe =
      document.createElement("iframe");

    iframe.setAttribute(
      "sandbox",
      "allow-scripts"
    );

    iframe.srcdoc =
      buildPreview(files);

    previewContainer.innerHTML =
      "<h3 style='margin-bottom:12px'>👁️ Aperçu</h3>";

    previewContainer.appendChild(
      iframe
    );

  }

  result.classList.add("show");

  result.scrollIntoView({
    behavior: "smooth"
  });

}


/*
 * Construit un aperçu HTML
 */

function buildPreview(files) {

  let html =
    files["index.html"];

  if (!html) {
    return "";
  }

  if (
    files["style.css"] &&
    !html.includes(
      "style.css"
    )
  ) {

    html =
      html.replace(
        "</head>",
        "<style>" +
        files["style.css"] +
        "</style></head>"
      );

  }

  if (
    files["script.js"] &&
    !html.includes(
      "script.js"
    )
  ) {

    html =
      html.replace(
        "</body>",
        "<script>" +
        files["script.js"] +
        "<\/script></body>"
      );

  }

  return html;

}


/*
 * Téléchargement ZIP
 */

downloadButton.addEventListener(
  "click",
  async () => {

    if (!currentProject) {

      showError(
        "Aucun projet à télécharger."
      );

      return;
    }

    downloadButton.disabled =
      true;

    downloadButton.textContent =
      "⏳ Création du ZIP...";

    try {

      const response =
        await fetch(
          API + "/api/download",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              project:
                currentProject
            })
          }
        );

      if (!response.ok) {

        let message =
          "Impossible de créer le ZIP.";

        try {

          const data =
            await response.json();

          message =
            data.error ||
            message;

        } catch {}

        throw new Error(
          message
        );

      }

      const blob =
        await response.blob();

      const url =
        URL.createObjectURL(
          blob
        );

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        (
          currentProject.projectName ||
          "onescript-project"
        )
        .replace(
          /[^a-zA-Z0-9-_]/g,
          "-"
        )
        .toLowerCase()
        + ".zip";

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      URL.revokeObjectURL(
        url
      );

    } catch (error) {

      showError(
        error.message
      );

    } finally {

      downloadButton.disabled =
        false;

      downloadButton.textContent =
        "📦 Télécharger le ZIP";

    }

  }
);


/*
 * Ctrl + Entrée pour générer
 */

promptInput.addEventListener(
  "keydown",
  event => {

    if (
      event.ctrlKey &&
      event.key === "Enter"
    ) {

      generateButton.click();

    }

  }
);

</script>

</body>
</html>
